default_environment: dev
project_id: 019e5d1c-08ca-739a-ab9b-30a019db695e
environments:
- name: dev
- name: staging
- name: prod
python: python3.11
plugins:
  extractors:
  - name: tap-postgres
    variant: meltanolabs
    pip_url: meltanolabs-tap-postgres
    config:
      database: postgres
      filter_schemas:
      - public
      host: aws-1-ap-northeast-2.pooler.supabase.com
      port: 5432
      user: postgres.oztxcxhjctreoxtjdnhb
    select:
    - public-resale_flat_prices_from_jan_2017.*
  loaders:
  - name: target-bigquery
    variant: z3z1ma
    pip_url: "git+https://github.com/z3z1ma/target-bigquery.git setuptools<80"
    config:
      credentials_path: /home/kennywong/bigquery-admin-key.json
      dataset: resale
      denormalized: true
      flattening_enabled: true
      flattening_max_depth: 1
      method: batch_job
      project: mydsaiproject0001
